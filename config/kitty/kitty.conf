# ~/.config/kitty/kitty.conf
# Production terminal config — Catppuccin Mocha, Wayland-native, Nerd Font.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 11.0

# Wayland-native rendering (kitty auto-detects; this just documents intent).
linux_display_server wayland

# Clipboard — kitty uses wl-clipboard automatically under Wayland; no extra config required.
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select clipboard

# Sane scrollback / performance
scrollback_lines 10000
enable_audio_bell no
update_check_interval 0

# Shell
shell zsh
shell_integration enabled

# Window
window_padding_width 6
confirm_os_window_close 0
hide_window_decorations yes

# Tabs (useful with tmux, but native kitty tabs also available)
tab_bar_edge bottom
tab_bar_style powerline

# ── Catppuccin Mocha color scheme ──
foreground #CDD6F4
background #1E1E2E
selection_foreground #1E1E2E
selection_background #F5E0DC

cursor #F5E0DC
cursor_text_color #1E1E2E

url_color #F5E0DC

active_border_color #B4BEFE
inactive_border_color #6C7086
bell_border_color #F9E2AF

wayland_titlebar_color background
active_tab_background #1E1E2E
active_tab_foreground #CDD6F4
inactive_tab_background #181825
inactive_tab_foreground #A6ADC8
tab_bar_background #11111B

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8
