<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
	<defs>
		<!-- Atlantic Coast Canvas & Tone Styles -->
		<style>
      .bg-canvas { fill: #0A0E17; }
      .grid-lines { stroke: #162238; stroke-width: 1.5px; fill: none; }
      .poly-bg { stroke: #1B2A4A; stroke-width: 2px; fill: none; }
      .frame-slate { stroke: #223354; stroke-width: 2.5px; fill: none; stroke-linejoin: round; }
      .ocean-trace { stroke: #0984E3; stroke-width: 3.5px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ocean-fill { fill: #0984E3; }
      .teal-route { stroke: #00CEC9; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal-dot { fill: #00CEC9; }
      .hud-bracket { stroke: #223354; stroke-width: 1.5px; fill: none; }
      .hud-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 32px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.25em; }
      .hud-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 16px; font-weight: 600; fill: #00CEC9; letter-spacing: 0.2em; }
    </style>

		<!-- Isometric Matrix Background Grid Pattern -->
		<pattern id="caravela-grid-v2" width="160" height="277.12"
			patternUnits="userSpaceOnUse">
			<path d="M80 0 L160 46.18 L160 138.56 L80 184.74 L0 138.56 L0 46.18 Z"
				class="grid-lines" />
			<path d="M80 0 L80 92.37 M0 46.18 L80 92.37 M160 46.18 L80 92.37"
				class="grid-lines" />
		</pattern>
	</defs>

	<!-- Canvas -->
	<rect width="3840" height="2160" class="bg-canvas" />
	<rect width="3840" height="2160" fill="url(#caravela-grid-v2)" />

	<!-- Background Polyomino Tetromino Wireframes -->
	<g class="poly-bg">
		<!-- Top Left Blocks -->
		<path d="M 450,280 h 180 v 360 h -180 z" />
		<path d="M 630,460 h 360 v 180 h -180 v 180 h -180 z" />
		<!-- Top Right Blocks -->
		<path d="M 3120,380 h 360 v 180 h -180 v 180 h -180 z" />
		<path d="M 3300,560 h 180 v 360 h -180 z" />
		<!-- Bottom Right Blocks -->
		<path d="M 2880,1420 h 200 v 200 h 200 v 200 h -400 z" />
		<path d="M 3080,1620 h 200 v 400 h -200 z" />
		<!-- Bottom Left Blocks -->
		<path d="M 620,1350 h 400 v 200 h -200 v 200 h -200 z" />
	</g>

	<!-- Central Emblem: Precision Sextant Frame & Great-Circle Vector Arc -->
	<g transform="translate(1920, 1080)">

		<!-- Outer Sextant Limbs & Vernier Arc Scale -->
		<g class="frame-slate">
			<!-- Apex Index Arm & Pivot Point -->
			<path d="M 0,-480 L -360,260 L 360,260 Z" />
			<line x1="0" y1="-480" x2="0" y2="260" />
			<line x1="0" y1="-480" x2="160" y2="340" />
			<circle cx="0" cy="-480" r="32" />
			<circle cx="0" cy="-480" r="14" />

			<!-- Lower Graduated Arc Limbs -->
			<path d="M -440,260 Q 0,380 440,260" />
			<path d="M -480,320 Q 0,460 480,320" />
			<path d="M -400,200 Q 0,300 400,200" stroke-dasharray="8 8" />

			<!-- Vernier Graduation Ticks -->
			<line x1="-360" y1="260" x2="-380" y2="300" />
			<line x1="-240" y1="285" x2="-250" y2="330" />
			<line x1="-120" y1="305" x2="-125" y2="350" />
			<line x1="0" y1="315" x2="0" y2="365" stroke-width="3" />
			<line x1="120" y1="305" x2="125" y2="350" />
			<line x1="240" y1="285" x2="250" y2="330" />
			<line x1="360" y1="260" x2="380" y2="300" />
		</g>

		<!-- Deep Ocean (#0984E3) Structural Mirrors & Horizon Prism Wireframe -->
		<g class="ocean-trace">
			<!-- Index Mirror Assembly at Apex -->
			<polygon points="-50,-420 50,-420 70,-340 -30,-340" />
			<line x1="-30" y1="-340" x2="0" y2="-480" />

			<!-- Horizon Glass Frame (Mid Left) -->
			<rect x="-240" y="-120" width="100" height="140"
				transform="rotate(15 -190 -50)" />
			<line x1="-220" y1="-100" x2="-150" y2="10" />

			<!-- Telescope Sight Tube Line -->
			<path d="M 280,-180 L 120,-70 L -40,40" />
			<polygon points="280,-180 260,-220 220,-190 240,-150" />

			<!-- Coordinate Triangulation Ribs -->
			<path d="M -360,260 L -180,60 L 0,260 L 180,60 L 360,260" />
		</g>

		<!-- Maré Teal (#00CEC9) Transatlantic Great-Circle Trajectory & Bearing Cuts -->
		<g class="teal-route">
			<!-- Oceanic Great-Circle Wave Route -->
			<path d="M -560,-60 Q -240,-260 40,-60 T 560,180" />

			<!-- Cross-Bearing Navigation Vector Line -->
			<path d="M -320,-320 L 0,-480 L 340,-140" />
			<path d="M 0,-480 L 160,340 L 220,440" />

			<!-- Apex Optical Sighting Ray -->
			<path d="M -40,40 L -180,180 L -360,260" />
		</g>

		<!-- Astronomical Waypoint / Fix Nodes -->
		<circle cx="0" cy="-480" r="6" class="teal-dot" />
		<circle cx="160" cy="340" r="5" class="teal-dot" />
		<circle cx="-560" cy="-60" r="4.5" class="teal-dot" />
		<circle cx="560" cy="180" r="4.5" class="teal-dot" />
		<circle cx="40" cy="-60" r="5" class="ocean-fill" />
		<circle cx="-180" cy="60" r="4" class="ocean-fill" />
		<circle cx="180" cy="60" r="4" class="ocean-fill" />
	</g>

	<!-- Bottom-Left Technical HUD: Name & Polyomino Only -->
	<g transform="translate(140, 1970)">
		<!-- Accent Bracket & Lead Point -->
		<path class="hud-bracket" d="M 0,-70 L 0,35 L 280,35" />
		<rect x="-4" y="-70" width="8" height="8" class="teal-dot" />

		<!-- Minimal Typography -->
		<text x="25" y="-20" class="hud-title">CARAVELA</text>
		<text x="26" y="18" class="hud-sub">POLYOMINO</text>
	</g>
</svg>
