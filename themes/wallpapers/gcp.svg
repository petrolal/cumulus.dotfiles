    <line x1="600" y1="1400" x2="1000" y2="1550" stroke="#3C4043" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="1000" y1="1550" x2="1300" y2="1350" stroke="#3C4043" stroke-width="1.5" stroke-dasharray="4 4" />

    <circle cx="200" cy="1600" r="5" fill="#4285F4" />
    <circle cx="600" cy="1400" r="5" fill="#EA4335" />
    <circle cx="1000" cy="1550" r="5" fill="#FBBC05" />
    <circle cx="1300" cy="1350" r="5" fill="#34A853" />
