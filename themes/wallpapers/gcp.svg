      <stop offset="0%" stop-color="#17191C" />
      <stop offset="100%" stop-color="#111418" />
    </linearGradient>

    <linearGradient id="gcp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
