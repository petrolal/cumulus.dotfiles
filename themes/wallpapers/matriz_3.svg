<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
	<defs>
		<style>
      .bg-canvas { fill: #0F1117; }
      .grid-lines { stroke: #1A1E27; stroke-width: 1.5px; fill: none; }
      .poly-bg { stroke: #2B303C; stroke-width: 2px; fill: none; opacity: 0.35; }
      .struct-frame { stroke: #2B303C; stroke-width: 3px; fill: none; stroke-linejoin: round; }
      .struct-sub { stroke: #1E3850; stroke-width: 1.5px; fill: none; stroke-dasharray: 6 10; }
      .gold-trace { stroke: #EBB434; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gold-node { fill: #EBB434; }
      .teal-trace { stroke: #00D2D3; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal-node { fill: #00D2D3; }
      .hud-bracket { stroke: #2B303C; stroke-width: 1.5px; fill: none; }
      .hud-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 32px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.25em; }
      .hud-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 16px; font-weight: 600; fill: #EBB434; letter-spacing: 0.2em; }
    </style>

		<!-- Isometric Matrix Background Grid Pattern -->
		<pattern id="matriz-grid-alt" width="160" height="277.12"
			patternUnits="userSpaceOnUse">
			<path d="M80 0 L160 46.18 L160 138.56 L80 184.74 L0 138.56 L0 46.18 Z"
				class="grid-lines" />
			<path d="M80 0 L80 92.37 M0 46.18 L80 92.37 M160 46.18 L80 92.37"
				class="grid-lines" />
		</pattern>
	</defs>

	<!-- Monolith Dark Canvas -->
	<rect width="3840" height="2160" class="bg-canvas" />
	<rect width="3840" height="2160" fill="url(#matriz-grid-alt)" />

	<!-- Background Isometric Polyomino Block Silhouettes -->
	<g class="poly-bg">
		<!-- Top Left Blocks -->
		<polygon points="500,280 660,187.6 660,372.4 500,464.8" />
		<polygon points="660,187.6 820,280 820,464.8 660,372.4" />
		<polygon points="340,372.4 500,280 500,464.8 340,557.2" />
		<!-- Top Right Blocks -->
		<polygon points="3100,320 3260,227.6 3420,320 3260,412.4" />
		<polygon points="3260,412.4 3420,320 3420,504.8 3260,597.2" />
		<!-- Bottom Right Blocks -->
		<polygon points="2900,1400 3060,1307.6 3060,1492.4 2900,1584.8" />
		<polygon points="3060,1492.4 3220,1400 3220,1584.8 3060,1677.2" />
		<polygon points="3060,1677.2 3220,1584.8 3220,1769.6 3060,1862" />
		<!-- Bottom Left Blocks -->
		<polygon points="620,1420 780,1327.6 940,1420 780,1512.4" />
		<polygon points="620,1420 780,1512.4 780,1697.2 620,1604.8" />
	</g>

	<!-- Central Emblem: Stepped Isometric Ziggurat / Unfolded Cube Labyrinth -->
	<g transform="translate(1920, 1080)">
		<!-- Radial Geometric Projection Guides -->
		<g class="struct-sub">
			<circle cx="0" cy="0" r="520" />
			<circle cx="0" cy="0" r="320" />
			<line x1="-640" y1="0" x2="640" y2="0" />
			<line x1="0" y1="-500" x2="0" y2="500" />
			<line x1="-450" y1="-260" x2="450" y2="260" />
			<line x1="-450" y1="260" x2="450" y2="-260" />
		</g>

		<!-- Structural Slate Isometric Monolith Tiers -->
		<g class="struct-frame">
			<!-- Outer Hexagonal Hull Frame -->
			<polygon points="0,-480 415.7,-240 415.7,240 0,480 -415.7,240 -415.7,-240" />

			<!-- Stepped Terraces (Left Facet) -->
			<path d="M -415.7,-240 L -277.1,-160 L -277.1,320 L -415.7,240 Z" />
			<path d="M -277.1,-160 L -138.6,-80 L -138.6,400 L -277.1,320 Z" />
			<path d="M -138.6,-80 L 0,0 L 0,480 L -138.6,400 Z" />

			<!-- Stepped Terraces (Right Facet) -->
			<path d="M 415.7,-240 L 277.1,-160 L 277.1,320 L 415.7,240 Z" />
			<path d="M 277.1,-160 L 138.6,-80 L 138.6,400 L 277.1,320 Z" />
			<path d="M 138.6,-80 L 0,0 L 0,480 L 138.6,400 Z" />

			<!-- Isometric Roof Risers (Top Facet) -->
			<polygon points="0,-480 138.6,-400 0,-320 -138.6,-400" />
			<polygon points="-138.6,-400 0,-320 0,-160 -138.6,-240" />
			<polygon points="138.6,-400 0,-320 0,-160 138.6,-240" />
			<polygon points="0,-320 138.6,-240 0,-160 -138.6,-240" />
		</g>

		<!-- Axé Gold (#EBB434) Interlocking Matrix Pathways -->
		<g class="gold-trace">
			<!-- Top Crest Stepped Circuit -->
			<path d="M 0,-480 L 138.6,-400 L 138.6,-240 L 277.1,-160 L 277.1,80" />
			<!-- Mid-Left Chasm Crossing -->
			<path
				d="M -415.7,-80 L -277.1,0 L -277.1,160 L -138.6,240 L 0,160 L 138.6,240 L 138.6,400" />
			<!-- Right Step-Down Vector -->
			<path d="M 0,-160 L 138.6,-80 L 277.1,-160 L 415.7,-80 L 415.7,80" />
			<!-- Base Foundation Segment -->
			<path d="M -277.1,320 L -138.6,400 L 0,480" />
		</g>

		<!-- Maré Teal (#00D2D3) Matrix Seams & Axial Cuts -->
		<g class="teal-trace">
			<!-- Spine & Terrace Traverse -->
			<path d="M 0,-480 L -138.6,-400 L -138.6,-240 L 0,-160 L 0,0 L 0,320" />
			<!-- Symmetrical Left Rung -->
			<path d="M -415.7,-240 L -277.1,-160 L -138.6,-240 L 0,-320" />
			<!-- Descending Lateral Circuit -->
			<path
				d="M -277.1,-160 L -277.1,80 L -138.6,160 L 0,80 L 138.6,0 L 277.1,80 L 277.1,320" />
			<!-- Outer Peripheral Spur -->
			<path d="M 415.7,80 L 277.1,160 L 138.6,80" />
		</g>

		<!-- Critical Intersection Waypoint Nodes -->
		<circle cx="0" cy="-480" r="5.5" class="gold-node" />
		<circle cx="0" cy="480" r="5.5" class="gold-node" />
		<circle cx="0" cy="0" r="6" class="teal-node" />
		<circle cx="-277.1" cy="160" r="4.5" class="gold-node" />
		<circle cx="277.1" cy="80" r="4.5" class="gold-node" />
		<circle cx="-138.6" cy="-240" r="4.5" class="teal-node" />
		<circle cx="138.6" cy="240" r="4.5" class="teal-node" />
		<circle cx="0" cy="-160" r="5" class="teal-node" />
	</g>

	<!-- Bottom-Left Technical HUD: Name & Polyomino Only -->
	<g transform="translate(140, 1970)">
		<!-- Accent Bracket & Lead Point -->
		<path class="hud-bracket" d="M 0,-70 L 0,35 L 280,35" />
		<rect x="-4" y="-70" width="8" height="8" class="gold-node" />

		<!-- Minimal Typography -->
		<text x="25" y="-20" class="hud-title">MATRIZ</text>
		<text x="26" y="18" class="hud-sub">POLYOMINO</text>
	</g>
</svg>
