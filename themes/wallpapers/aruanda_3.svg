<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
	<defs>
		<!-- Aruanda Forest & Sunlight Palette Tokens -->
		<style>
      .bg-canvas { fill: #0B120F; }
      .grid-lines { stroke: #14261C; stroke-width: 1.5px; fill: none; }
      .poly-bg { stroke: #172B1F; stroke-width: 2px; fill: none; opacity: 0.35; }
      .struct-frame { stroke: #1D3627; stroke-width: 3px; fill: none; stroke-linejoin: round; }
      .guide-axis { stroke: #14261C; stroke-width: 1.5px; fill: none; stroke-dasharray: 6 10; }
      .mata-trace { stroke: #10AC84; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .amber-trace { stroke: #F5CD79; stroke-width: 3.5px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .solar-node { fill: #F5CD79; }
      .mata-node { fill: #10AC84; }
      .hud-bracket { stroke: #1D3627; stroke-width: 1.5px; fill: none; }
      .hud-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 32px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.25em; }
      .hud-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 16px; font-weight: 600; fill: #10AC84; letter-spacing: 0.2em; }
    </style>

		<!-- Isometric Matrix Background Grid -->
		<pattern id="aruanda-grid-quartinha" width="160" height="277.12"
			patternUnits="userSpaceOnUse">
			<path d="M80 0 L160 46.18 L160 138.56 L80 184.74 L0 138.56 L0 46.18 Z"
				class="grid-lines" />
			<path d="M80 0 L80 92.37 M0 46.18 L80 92.37 M160 46.18 L80 92.37"
				class="grid-lines" />
		</pattern>
	</defs>

	<!-- Monolith Dark Canvas -->
	<rect width="3840" height="2160" class="bg-canvas" />
	<rect width="3840" height="2160" fill="url(#aruanda-grid-quartinha)" />

	<!-- Background Isometric Polyomino Block Silhouettes -->
	<g class="poly-bg">
		<!-- Top Left -->
		<path d="M 480,300 h 360 v 180 h -180 v 180 h -180 z" />
		<path d="M 840,480 h 180 v 360 h -180 z" />
		<!-- Top Right -->
		<path d="M 3020,300 h 180 v 180 h 180 v 360 h -180 v -180 h -180 z" />
		<path d="M 2840,480 h 180 v 180 h -180 z" />
		<!-- Bottom Right -->
		<path d="M 2920,1380 h 200 v 400 h -200 z" />
		<path d="M 3120,1580 h 200 v 200 h -200 z" />
		<!-- Bottom Left -->
		<path d="M 540,1380 h 200 v 200 h 200 v 200 h -400 z" />
		<path d="M 740,1580 h 200 v 400 h -200 z" />
	</g>

	<!-- Central Emblem: Technical Wireframe Quartinha de Umbanda -->
	<g transform="translate(1920, 1080)">
		<!-- Radial Framing & Alignment Guides -->
		<g class="guide-axis">
			<circle cx="0" cy="0" r="540" />
			<circle cx="0" cy="0" r="320" />
			<line x1="-680" y1="0" x2="680" y2="0" />
			<line x1="0" y1="-620" x2="0" y2="620" />
			<line x1="-420" y1="-420" x2="420" y2="420" />
			<line x1="-420" y1="420" x2="420" y2="-420" />
		</g>

		<!-- Structural Vessel Outline (Clay Clay / Terracotta Vessel Geometry) -->
		<g class="struct-frame">
			<!-- Pedestal / Base -->
			<path d="M -160,440 L 160,440 L 120,380 L -120,380 Z" />
			<line x1="-140" y1="410" x2="140" y2="410" stroke-dasharray="4 6" />

			<!-- Lower Belly & Flared Hip Sections -->
			<path d="M -120,380 L -300,160 L -300,40 L -140,-120" />
			<path d="M 120,380 L 300,160 L 300,40 L 140,-120" />

			<!-- Neck & Rim Collar -->
			<path d="M -140,-120 L -110,-240 L 110,-240 L 140,-120" />
			<line x1="-125" y1="-180" x2="125" y2="-180" stroke-dasharray="8 8" />

			<!-- Domed Lid & Finial -->
			<path d="M -140,-240 L -110,-320 L 0,-370 L 110,-320 L 140,-240 Z" />
			<rect x="-24" y="-430" width="48" height="60" />
			<circle cx="0" cy="-450" r="22" />

			<!-- Structural Asymmetrical Water Spout (Bico) -->
			<path d="M 240,-40 L 380,-100 L 395,-80 L 260,20 Z" />
			<!-- Structural Handle Loop (Asa) -->
			<path d="M -260,-20 Q -420,60 -260,240 Q -360,80 -230,20" />
		</g>

		<!-- Mata Green Growth Vectors & Spiritual Leaf Seams (#10AC84) -->
		<g class="mata-trace">
			<!-- Water Spout Stream Vector -->
			<path d="M 240,-40 L 380,-100 L 460,-140 L 520,-140" />
			<line x1="395" y1="-80" x2="480" y2="-80" />

			<!-- Sacred Branching Arrow Upward Vectors on Belly -->
			<path d="M 0,380 L 0,-120" />
			<path d="M -120,180 L 0,60 L 120,180" />
			<path d="M -80,0 L 0,-80 L 80,0" />

			<!-- Vessel Body Circumference Seams -->
			<path d="M -300,40 Q 0,160 300,40" />
			<path d="M -260,-20 L -140,-120 L 0,-140 L 140,-120 L 240,-40" />

			<!-- Base Anchoring Roots -->
			<path d="M -120,380 L 0,440 L 120,380" />
		</g>

		<!-- Warm Amber Solar Radiance & Consecration Core (#F5CD79) -->
		<g class="amber-trace">
			<!-- Finial Apex Solar Beacon -->
			<circle cx="0" cy="-450" r="10" stroke-width="2" />
			<line x1="0" y1="-490" x2="0" y2="-410" />
			<line x1="-40" y1="-450" x2="40" y2="-450" />

			<!-- Sacred Core Consecration Nodes (Inner Diamond) -->
			<polygon points="0,0 70,60 0,120 -70,60" />
			<circle cx="0" cy="60" r="14" stroke-width="2" />

			<!-- Solar Radiance Rays Across Vessel Neck & Lid -->
			<path d="M -110,-320 L 0,-370 L 110,-320" />
			<line x1="0" y1="-370" x2="0" y2="-240" />
			<path d="M -70,60 L -180,60 L -300,40" />
			<path d="M 70,60 L 180,60 L 300,40" />

			<!-- Base Light Line -->
			<line x1="-80" y1="440" x2="80" y2="440" />
		</g>

		<!-- Calibrated Spiritual Energy Nodes -->
		<circle cx="0" cy="-450" r="5" class="solar-node" />
		<circle cx="0" cy="-370" r="4" class="solar-node" />
		<circle cx="0" cy="60" r="6" class="solar-node" />
		<circle cx="520" cy="-140" r="5" class="mata-node" />
		<circle cx="-300" cy="40" r="4.5" class="mata-node" />
		<circle cx="300" cy="40" r="4.5" class="mata-node" />
		<circle cx="-300" cy="160" r="4.5" class="mata-node" />
		<circle cx="300" cy="160" r="4.5" class="mata-node" />
		<circle cx="0" cy="380" r="5" class="mata-node" />
	</g>

	<!-- Bottom-Left Technical HUD: Name & Polyomino Only -->
	<g transform="translate(140, 1970)">
		<!-- Accent Bracket & Lead Point -->
		<path class="hud-bracket" d="M 0,-70 L 0,35 L 280,35" />
		<rect x="-4" y="-70" width="8" height="8" class="solar-node" />

		<!-- Minimal Typography -->
		<text x="25" y="-20" class="hud-title">ARUANDA</text>
		<text x="26" y="18" class="hud-sub">POLYOMINO</text>
	</g>
</svg>
