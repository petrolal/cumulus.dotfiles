    <rect x="360" y="120" width="120" height="20" fill="#EA4335" /> <rect x="240" y="200" width="160" height="20" fill="#FBBC05" /> <rect x="520" y="200" width="160" height="20" fill="#34A853" /> <rect x="40" y="280" width="200" height="20" fill="#24C1E0" /> </g>

