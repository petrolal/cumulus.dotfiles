<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001829" />
      <stop offset="100%" stop-color="#00101C" />
    </linearGradient>

    <linearGradient id="azure-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#00BCF2" />
    </linearGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg-grad)" />

  <g fill="none" stroke="#0078D4" opacity="0.12" stroke-width="1.5">
    <circle cx="0" cy="0" r="600" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="900" />
    <circle cx="0" cy="0" r="1200" stroke-dasharray="12 8" />
  </g>

  <g filter="url(#subtle-glow)">
    <path d="
      M 0 320
      A 220 220 0 0 0 380 320
      A 280 280 0 0 0 880 260
      A 180 180 0 0 0 1060 0
      L 0 0 Z"
      fill="#002238" opacity="0.85" />

    <path d="
      M 0 240
      A 170 170 0 0 0 300 240
      A 220 220 0 0 0 700 200
      A 140 140 0 0 0 840 0
      L 0 0 Z"
      fill="#001220" />

    <path d="
      M 0 240
      A 170 170 0 0 0 300 240
      A 220 220 0 0 0 700 200
      A 140 140 0 0 0 840 0"
      fill="none" stroke="url(#azure-accent)" stroke-width="6" stroke-linecap="round" />

    <path d="
      M 0 160
      A 130 130 0 0 0 220 160
      A 160 160 0 0 0 520 130"
      fill="none" stroke="#00BCF2" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <g transform="translate(3300, 1960)">
    <rect x="-24" y="-38" width="6" height="80" rx="3" fill="url(#azure-accent)" />

    <text x="0" y="0"
          fill="#E2F1FF"
          font-family="Fira Code, JetBrains Mono, monospace, sans-serif"
          font-size="42"
          font-weight="600"
          letter-spacing="12"
          opacity="0.85">polyomino</text>

    <text x="0" y="36"
          fill="#8CBBD9"
          font-family="Fira Code, JetBrains Mono, monospace, sans-serif"
          font-size="16"
          letter-spacing="6"
          opacity="0.55">SWAY // AZURE THEME</text>
  </g>
</svg>
