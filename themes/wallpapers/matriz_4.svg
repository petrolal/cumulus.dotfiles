<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
	<defs>
		<style>
      .bg-canvas { fill: #0F1117; }
      .grid-lines { stroke: #1A1E27; stroke-width: 1.5px; fill: none; }
      .poly-bg { stroke: #2B303C; stroke-width: 2px; fill: none; opacity: 0.35; }
      .core-shell { stroke: #2B303C; stroke-width: 3px; fill: none; stroke-linejoin: round; }
      .tesseract-inner { stroke: #1E3850; stroke-width: 2px; fill: none; stroke-linejoin: round; }
      .guide-axis { stroke: #1A1E27; stroke-width: 1.5px; fill: none; stroke-dasharray: 6 10; }
      .gold-trace { stroke: #EBB434; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gold-node { fill: #EBB434; }
      .teal-trace { stroke: #00D2D3; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal-node { fill: #00D2D3; }
      .hud-bracket { stroke: #2B303C; stroke-width: 1.5px; fill: none; }
      .hud-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 32px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.25em; }
      .hud-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 16px; font-weight: 600; fill: #EBB434; letter-spacing: 0.2em; }
    </style>

		<!-- Isometric Matrix Background Grid -->
		<pattern id="matriz-grid-hyper" width="160" height="277.12"
			patternUnits="userSpaceOnUse">
			<path d="M80 0 L160 46.18 L160 138.56 L80 184.74 L0 138.56 L0 46.18 Z"
				class="grid-lines" />
			<path d="M80 0 L80 92.37 M0 46.18 L80 92.37 M160 46.18 L80 92.37"
				class="grid-lines" />
		</pattern>
	</defs>

	<!-- Background Base Canvas -->
	<rect width="3840" height="2160" class="bg-canvas" />
	<rect width="3840" height="2160" fill="url(#matriz-grid-hyper)" />

	<!-- Background Polyomino Shapes -->
	<g class="poly-bg">
		<!-- Top Left -->
		<path d="M 460,300 h 320 v 160 h -160 v 160 h -160 z" />
		<path d="M 780,300 h 160 v 320 h -160 z" />
		<!-- Top Right -->
		<path d="M 3040,280 h 160 v 480 h -160 z" />
		<path d="M 2880,440 h 160 v 160 h 160 v 160 h -320 z" />
		<!-- Bottom Right -->
		<path d="M 2960,1380 h 320 v 160 h -160 v 320 h -160 z" />
		<!-- Bottom Left -->
		<path d="M 520,1360 h 160 v 160 h 160 v 320 h -160 v -160 h -160 z" />
	</g>

	<!-- Central Emblem: Isometric 4D Hypercube (Tesseract Lattice) -->
	<g transform="translate(1920, 1080)">
		<!-- Dynamic Alignment Guides -->
		<g class="guide-axis">
			<circle cx="0" cy="0" r="540" />
			<circle cx="0" cy="0" r="260" />
			<line x1="-700" y1="0" x2="700" y2="0" />
			<line x1="0" y1="-560" x2="0" y2="560" />
			<line x1="-484.9" y1="-280" x2="484.9" y2="280" />
			<line x1="-484.9" y1="280" x2="484.9" y2="-280" />
		</g>

		<!-- Outer Isometric Cube Shell (Large Frame) -->
		<g class="core-shell">
			<polygon points="0,-480 415.7,-240 415.7,240 0,480 -415.7,240 -415.7,-240" />
			<line x1="0" y1="-480" x2="0" y2="0" />
			<line x1="415.7" y1="240" x2="0" y2="0" />
			<line x1="-415.7" y1="240" x2="0" y2="0" />
		</g>

		<!-- Inner Isometric Cube Core (Suspended in Perspective) -->
		<g class="tesseract-inner">
			<polygon points="0,-220 190.5,-110 190.5,110 0,220 -190.5,110 -190.5,-110" />
			<line x1="0" y1="-220" x2="0" y2="0" />
			<line x1="190.5" y1="110" x2="0" y2="0" />
			<line x1="-190.5" y1="110" x2="0" y2="0" />

			<!-- Tesseract Hyper-Edges (Connecting Inner to Outer Vertices) -->
			<line x1="0" y1="-480" x2="0" y2="-220" />
			<line x1="415.7" y1="-240" x2="190.5" y2="-110" />
			<line x1="415.7" y1="240" x2="190.5" y2="110" />
			<line x1="0" y1="480" x2="0" y2="220" />
			<line x1="-415.7" y1="240" x2="-190.5" y2="110" />
			<line x1="-415.7" y1="-240" x2="-190.5" y2="-110" />
		</g>

		<!-- Axé Gold (#EBB434) Diagonal Routing Circuits -->
		<g class="gold-trace">
			<!-- Outer-to-Inner Dimension Jump (Upper Right to Center) -->
			<path d="M 415.7,-240 L 190.5,-110 L 0,-220 L 0,-480" />
			<!-- Midplate Intersecting Seam -->
			<path d="M -415.7,-240 L -190.5,-110 L 0,0 L 190.5,110 L 415.7,240" />
			<!-- Lower Foundation Vector -->
			<path d="M -190.5,110 L 0,220 L 0,480 L -415.7,240" />
			<!-- Peripheral Stepped Accent -->
			<path d="M 190.5,-110 L 190.5,110 L 0,220" />
		</g>

		<!-- Maré Teal (#00D2D3) Axial Flow Channels -->
		<g class="teal-trace">
			<!-- Outer-to-Inner Dimension Jump (Upper Left to Deep Center) -->
			<path d="M -415.7,-240 L 0,-480 L 415.7,-240 L 415.7,240" />
			<!-- Vertical Central Conduit -->
			<path d="M 0,-220 L 0,0 L 0,220" />
			<!-- Lower Traverse Branch -->
			<path d="M -415.7,240 L -190.5,110 L 0,0 L 190.5,-110 L 415.7,-240" />
			<!-- Core Anchor Vector -->
			<path d="M 0,0 L -190.5,-110 L -190.5,110" />
		</g>

		<!-- Dimensional Node Waypoints -->
		<circle cx="0" cy="-480" r="5.5" class="gold-node" />
		<circle cx="415.7" cy="-240" r="5.5" class="gold-node" />
		<circle cx="415.7" cy="240" r="5.5" class="gold-node" />
		<circle cx="0" cy="480" r="5.5" class="gold-node" />
		<circle cx="-415.7" cy="240" r="5.5" class="gold-node" />
		<circle cx="-415.7" cy="-240" r="5.5" class="gold-node" />

		<circle cx="0" cy="-220" r="4.5" class="teal-node" />
		<circle cx="190.5" cy="-110" r="4.5" class="teal-node" />
		<circle cx="190.5" cy="110" r="4.5" class="teal-node" />
		<circle cx="0" cy="220" r="4.5" class="teal-node" />
		<circle cx="-190.5" cy="110" r="4.5" class="teal-node" />
		<circle cx="-190.5" cy="-110" r="4.5" class="teal-node" />
		<circle cx="0" cy="0" r="6" class="teal-node" />
	</g>

	<!-- Bottom-Left Technical HUD: Name & Polyomino Only -->
	<g transform="translate(140, 1970)">
		<!-- Accent Bracket & Lead Point -->
		<path class="hud-bracket" d="M 0,-70 L 0,35 L 280,35" />
		<rect x="-4" y="-70" width="8" height="8" class="gold-node" />

		<!-- Minimal Typography -->
		<text x="25" y="-20" class="hud-title">MATRIZ</text>
		<text x="26" y="18" class="hud-sub">POLYOMINO</text>
	</g>
</svg>
