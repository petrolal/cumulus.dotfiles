<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
	<defs>
		<!-- Atlantic Coast Canvas & Tone Styles -->
		<style>
      .bg-canvas { fill: #0A0E17; }
      .grid-lines { stroke: #162238; stroke-width: 1.5px; fill: none; }
      .poly-bg { stroke: #1B2A4A; stroke-width: 2px; fill: none; opacity: 0.35; }
      .hull-frame { stroke: #223354; stroke-width: 3px; fill: none; stroke-linejoin: round; }
      .guide-axis { stroke: #162238; stroke-width: 1.5px; fill: none; stroke-dasharray: 6 10; }
      .ocean-trace { stroke: #0984E3; stroke-width: 3.5px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ocean-fill { fill: #0984E3; }
      .teal-trace { stroke: #00CEC9; stroke-width: 4px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal-dot { fill: #00CEC9; }
      .hud-bracket { stroke: #223354; stroke-width: 1.5px; fill: none; }
      .hud-title { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 32px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.25em; }
      .hud-sub { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 16px; font-weight: 600; fill: #00CEC9; letter-spacing: 0.2em; }
    </style>

		<!-- Isometric Blueprint Grid Pattern -->
		<pattern id="caravela-grid-ship" width="160" height="277.12"
			patternUnits="userSpaceOnUse">
			<path d="M80 0 L160 46.18 L160 138.56 L80 184.74 L0 138.56 L0 46.18 Z"
				class="grid-lines" />
			<path d="M80 0 L80 92.37 M0 46.18 L80 92.37 M160 46.18 L80 92.37"
				class="grid-lines" />
		</pattern>
	</defs>

	<!-- Monolith Dark Canvas -->
	<rect width="3840" height="2160" class="bg-canvas" />
	<rect width="3840" height="2160" fill="url(#caravela-grid-ship)" />

	<!-- Background Polyomino Tetromino Wireframes -->
	<g class="poly-bg">
		<!-- Top Left -->
		<path d="M 480,320 h 360 v 180 h -180 v 180 h -180 z" />
		<path d="M 840,500 h 180 v 360 h -180 z" />
		<!-- Top Right -->
		<path d="M 3020,300 h 180 v 180 h 180 v 360 h -180 v -180 h -180 z" />
		<path d="M 2840,480 h 180 v 180 h -180 z" />
		<!-- Bottom Right -->
		<path d="M 2920,1380 h 200 v 400 h -200 z" />
		<path d="M 3120,1580 h 200 v 200 h -200 z" />
		<!-- Bottom Left -->
		<path d="M 540,1380 h 200 v 200 h 200 v 200 h -400 z" />
		<path d="M 740,1580 h 200 v 400 h -200 z" />
	</g>

	<!-- Central Emblem: Technical Wireframe Caravela (Caravel Vessel & Rigging) -->
	<g transform="translate(1920, 1080)">
		<!-- Radial Navigational Circles & Horizon Reference Guides -->
		<g class="guide-axis">
			<circle cx="0" cy="0" r="560" />
			<circle cx="0" cy="0" r="380" />
			<line x1="-720" y1="240" x2="720" y2="240" />
			<line x1="0" y1="-620" x2="0" y2="620" />
			<line x1="-480" y1="-300" x2="480" y2="300" />
			<line x1="-480" y1="300" x2="480" y2="-300" />
		</g>

		<!-- Structural Slate Hull Geometry (Caravel Keel, Stern Castle, Bowsprit) -->
		<g class="hull-frame">
			<!-- Main Hull Profile -->
			<path
				d="M -440,140 L -380,260 L -240,360 L 260,360 L 460,200 L 520,80 L 280,120 L -320,120 Z" />
			<!-- Keel & Rib Transoms -->
			<line x1="-240" y1="360" x2="-240" y2="200" stroke-dasharray="4 6" />
			<line x1="-80" y1="360" x2="-80" y2="160" stroke-dasharray="4 6" />
			<line x1="80" y1="360" x2="80" y2="160" stroke-dasharray="4 6" />
			<line x1="260" y1="360" x2="260" y2="180" stroke-dasharray="4 6" />
			<!-- Stern Castle (Aft) -->
			<path d="M -440,140 L -460,20 L -340,20 L -320,120" />
			<line x1="-450" y1="60" x2="-330" y2="60" />
			<!-- Bowsprit Spar (Forward) -->
			<path d="M 460,200 L 620,0" />
		</g>

		<!-- Deep Ocean (#0984E3) Masts, Yards & Lateen Triangular Rigging -->
		<g class="ocean-trace">
			<!-- Main Mast & Fore Mast -->
			<line x1="-40" y1="200" x2="-40" y2="-440" stroke-width="4" />
			<line x1="220" y1="160" x2="220" y2="-320" stroke-width="3.5" />
			<line x1="-260" y1="120" x2="-260" y2="-220" stroke-width="3" />

			<!-- Lateen Sail Yards (Slanted Crossbeams) -->
			<line x1="-180" y1="-120" x2="140" y2="-480" />
			<line x1="120" y1="-60" x2="340" y2="-360" />
			<line x1="-360" y1="-40" x2="-140" y2="-240" />

			<!-- Cross of the Order of Christ (Cruz de Cristo Wireframe on Main Sail) -->
			<path
				d="M -60,-240 h 40 v -40 h 20 v 40 h 40 v 20 h -40 v 40 h -20 v -40 h -40 z" />

			<!-- Standing Rigging Stays -->
			<line x1="-40" y1="-440" x2="-320" y2="120" stroke-dasharray="6 6" />
			<line x1="-40" y1="-440" x2="280" y2="120" stroke-dasharray="6 6" />
			<line x1="220" y1="-320" x2="620" y2="0" stroke-dasharray="6 6" />
		</g>

		<!-- Maré Teal (#00CEC9) Lateen Sail Curves & Ocean Vector Currents -->
		<g class="teal-trace">
			<!-- Main Lateen Sail Canvas Profile -->
			<path d="M 140,-480 Q 20,-260 -180,-120 Q -40,-60 140,-480" />
			<!-- Fore Lateen Sail Profile -->
			<path d="M 340,-360 Q 240,-180 120,-60 Q 220,-20 340,-360" />
			<!-- Mizzen Lateen Sail Profile -->
			<path d="M -140,-240 Q -240,-120 -360,-40 Q -240,0 -140,-240" />

			<!-- Dynamic Waterline Wave Vectors -->
			<path d="M -620,240 Q -380,180 -140,240 T 360,240 T 640,180" />
			<path d="M -480,300 Q -240,240 0,300 T 520,280" />

			<!-- Transatlantic Trajectory from Bow -->
			<path d="M 620,0 L 700,-40 L 780,-40" />
		</g>

		<!-- Navigational Anchor & Waypoint Nodes -->
		<circle cx="-40" cy="-440" r="5.5" class="teal-dot" />
		<circle cx="220" cy="-320" r="4.5" class="teal-dot" />
		<circle cx="620" cy="0" r="5" class="teal-dot" />
		<circle cx="-460" cy="20" r="4.5" class="ocean-fill" />
		<circle cx="140" cy="-480" r="4" class="ocean-fill" />
		<circle cx="340" cy="-360" r="4" class="ocean-fill" />
		<circle cx="-240" cy="360" r="4.5" class="ocean-fill" />
		<circle cx="260" cy="360" r="4.5" class="ocean-fill" />
	</g>

	<!-- Bottom-Left Technical HUD: Name & Polyomino Only -->
	<g transform="translate(140, 1970)">
		<!-- Accent Bracket & Lead Point -->
		<path class="hud-bracket" d="M 0,-70 L 0,35 L 280,35" />
		<rect x="-4" y="-70" width="8" height="8" class="teal-dot" />

		<!-- Minimal Typography -->
		<text x="25" y="-20" class="hud-title">CARAVELA</text>
		<text x="26" y="18" class="hud-sub">POLYOMINO</text>
	</g>
</svg>
