[package]
name = "cumulus-dotfiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Rust tooling for the cumulus.dotfiles Sway/Wayland desktop (theme engine, installers, and helpers)."
authors = ["Lucas Petrola"]
license = "MIT"
repository = "https://github.com/petrolal/cumulus.dotfiles"
homepage = "https://github.com/petrolal/cumulus.dotfiles"
readme = "README.md"
keywords = ["sway", "wayland", "dotfiles", "theme", "desktop"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/*"]

# The library holds all logic; each `cumulus-*` command is a thin multi-call
# binary that dispatches on its own name. `cargo install cumulus-dotfiles`
# installs every one of them into ~/.cargo/bin.
[lib]
name = "cumulus_dotfiles"
path = "src/lib.rs"

[[bin]]
name = "cumulus"
path = "src/main.rs"

[[bin]]
name = "cumulus-theme"
path = "src/bin/cumulus-theme.rs"

[[bin]]
name = "cumulus-runtime-refresh"
path = "src/bin/cumulus-runtime-refresh.rs"

[[bin]]
name = "cumulus-os-colorscheme"
path = "src/bin/cumulus-os-colorscheme.rs"

[[bin]]
name = "cumulus-rgb-theme"
path = "src/bin/cumulus-rgb-theme.rs"

[[bin]]
name = "cumulus-lock"
path = "src/bin/cumulus-lock.rs"

[[bin]]
name = "cumulus-idle"
path = "src/bin/cumulus-idle.rs"

[[bin]]
name = "cumulus-screenshot"
path = "src/bin/cumulus-screenshot.rs"

[[bin]]
name = "cumulus-validate"
path = "src/bin/cumulus-validate.rs"

[[bin]]
name = "cumulus-backup"
path = "src/bin/cumulus-backup.rs"

[[bin]]
name = "cumulus-restore"
path = "src/bin/cumulus-restore.rs"

[[bin]]
name = "cumulus-update"
path = "src/bin/cumulus-update.rs"

[[bin]]
name = "cumulus-install-fonts"
path = "src/bin/cumulus-install-fonts.rs"

[[bin]]
name = "cumulus-install-apps"
path = "src/bin/cumulus-install-apps.rs"

[[bin]]
name = "cumulus-install-browser"
path = "src/bin/cumulus-install-browser.rs"

[[bin]]
name = "cumulus-install-devops"
path = "src/bin/cumulus-install-devops.rs"

[[bin]]
name = "cumulus-install-zsh"
path = "src/bin/cumulus-install-zsh.rs"

[[bin]]
name = "cumulus-install-sdkman"
path = "src/bin/cumulus-install-sdkman.rs"

[[bin]]
name = "cumulus-install-nvim"
path = "src/bin/cumulus-install-nvim.rs"

[[bin]]
name = "cumulus-install-nvim-deps"
path = "src/bin/cumulus-install-nvim-deps.rs"

[[bin]]
name = "cumulus-theme-picker"
path = "src/bin/cumulus-theme-picker.rs"

[[bin]]
name = "cumulus-whichkey"
path = "src/bin/cumulus-whichkey.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
